[project]
name = "nexus-ai"
version = "1.0.0"
description = "Next-generation multi-agent AI SDK with ADK patterns, A2UI protocol, and context engineering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NexusAI Team"}
]
keywords = ["ai", "agents", "multi-agent", "orchestration", "llm", "genui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=12.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.25",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "rich>=13.0",
    "typer>=0.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
dspy = ["dspy-ai>=2.4"]
langchain = ["langchain-core>=0.1"]
all = ["nexus-ai[dspy,langchain]"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.scripts]
nexus = "nexus_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
